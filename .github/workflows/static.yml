name: Publish GitHub Pages
on:
  push:
    # The build job publishes only the repository default branch.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript and Astro
        run: npm run check
      - name: Build static site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Check public output
        run: npm run test:links
      - name: Install test browser
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            npx playwright install --with-deps chromium
          fi
      - name: Test desktop, mobile and accessibility
        run: npm run test:e2e
      - name: Upload only public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-github
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
